services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aptelys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aptelys
      POSTGRES_USER: aptelys
      POSTGRES_PASSWORD: aptelys
    ports:
      - "5432:5432"
    volumes:
      - aptelys_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptelys -d aptelys"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aptelys_postgres_data:
